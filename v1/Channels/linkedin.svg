amily="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6b6875" text-anchor="start"><tspan x="88" dy="0.0">Head of Talent, Lumen Health</tspan></text><text x="88" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#1f1d24" text-anchor="start"><tspan x="88" dy="0.0">Love the new dashboard, but our payroll export has not</tspan><tspan x="88" dy="23.8">synced for two days. Can someone help?</tspan></text><g transform="translate(100 239)"><rect width="40" height="40" rx="8" fill="#5b4bdb"/><text x="20" y="27" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">HL</text></g><rect x="150" y="239.76" width="462" height="115.51999999999998" rx="12" fill="#eef3fb"/><text x="160" y="261.76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#1f1d24" text-anchor="start"><tspan x="160" dy="0.0">HireLoop · Author</tspan></text><text x="160" y="285.76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#1f1d24" text-anchor="start"><tspan x="160" dy="0.0">Thanks for flagging, Ananya. Sync is restored</tspan><tspan x="160" dy="23.8">and both days are back in your export. We&#x27;ve</tspan><tspan x="160" dy="23.8">emailed your team a summary.</tspan></text></svg>